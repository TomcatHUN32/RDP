name: Windows 2022

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      - name: Install ngrok
        shell: powershell
        run: |
          $url = "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\ngrok.zip"
          Expand-Archive "$env:TEMP\ngrok.zip" -DestinationPath "$env:USERPROFILE\ngrok" -Force

      - name: Configure ngrok
        shell: powershell
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          & "$env:USERPROFILE\ngrok\ngrok.exe" config add-authtoken "$env:NGROK_AUTH_TOKEN"

      - name: Enable Remote Desktop
        shell: powershell
        run: |
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 1

          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'

          Restart-Service -Name TermService -Force

      - name: Create RDP user
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if (-not $env:RDP_PASSWORD) {
            Write-Error "RDP_PASSWORD secret is missing."
            exit 1
          }

          $password = ConvertTo-SecureString `
            $env:RDP_PASSWORD `
            -AsPlainText `
            -Force

          New-LocalUser `
            -Name 'RDP' `
            -Password $password `
            -AccountNeverExpires `
            -PasswordNeverExpires

          Add-LocalGroupMember `
            -Group 'Remote Desktop Users' `
            -Member 'RDP'

          Add-LocalGroupMember `
            -Group 'Administrators' `
            -Member 'RDP'

      - name: Start ngrok TCP tunnel
        shell: powershell
        run: |
          Start-Process `
            -FilePath "$env:USERPROFILE\ngrok\ngrok.exe" `
            -ArgumentList 'tcp 3389' `
            -WindowStyle Hidden

          Start-Sleep -Seconds 8

          $tunnel = Invoke-RestMethod `
            -Uri 'http://127.0.0.1:4040/api/tunnels'

          $publicUrl = $tunnel.tunnels |
            Where-Object { $_.proto -eq 'tcp' } |
            Select-Object -First 1 -ExpandProperty public_url

          if (-not $publicUrl) {
            Write-Error "ngrok TCP tunnel was not created."
            exit 1
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "RDP CONNECTION"
          Write-Host "========================================"
          Write-Host "Address: $publicUrl"
          Write-Host "Username: RDP"
          Write-Host "========================================"
          Write-Host ""

      - name: Keep Windows machine alive
        shell: powershell
        run: |
          while ($true) {
            Write-Host "RDP is running..."
            Start-Sleep -Seconds 300
          }
